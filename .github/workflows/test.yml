name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Opsiyonel bagimliliklar (PDF/PNG/birlestirme)
        run: pip install cairocffi cairosvg pypdf || true
      - name: Offline testler (ag ve tarayici yok)
        run: python test_mcp.py --offline
