name: test

on:
  push:
  pull_request:

jobs:
  offline-test:
    name: offline test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sema + projeksiyon + DXF testleri (ag yok)
        run: python test_mcp.py --offline
